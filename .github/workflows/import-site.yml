name: Import site from original deployment

# One-off migration job: copies the live YamZah Kitchen site (HTML, JS, CSS and
# every image) from the original Cloudflare deployment into ./public and commits it.
# Re-run any time from the Actions tab ("Run workflow").

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/import-site.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download site files
        run: |
          set -euo pipefail
          SRC="https://yamzahkitchen.akinwaleismail.workers.dev"
          mkdir -p public/assets
          curl -fsSL "$SRC/" -o public/index.html
          get() { echo "-> $1"; curl -fsSL "$SRC/$1" -o "public/$1"; }
          # Assets referenced from index.html (JS bundle + CSS)
          for f in $(grep -oE 'assets/[A-Za-z0-9_.-]+' public/index.html | sort -u); do get "$f"; done
          JS=$(ls public/assets/*.js)
          # Static images referenced directly in the bundle
          for f in $(grep -ohE 'assets/[A-Za-z0-9_.-]+\.(png|jpe?g|webp|svg|gif|ico|woff2?|ttf|otf)' public/assets/*.js public/assets/*.css | sort -u); do get "$f"; done
          # Menu images: built as /assets/<key>.png, or <key>-20261006.webp for some dishes
          for k in $(grep -oE '\["[a-z-]+","[^"]+","[^"]+","[^"]+","[a-z0-9-]+"\]' $JS | sed -E 's/.*,"([a-z0-9-]+)"\]$/\1/' | sort -u); do
            if curl -fsSL "$SRC/assets/$k-20261006.webp" -o "public/assets/$k-20261006.webp"; then echo "-> $k webp"; else rm -f "public/assets/$k-20261006.webp"; fi
            if curl -fsSL "$SRC/assets/$k.png" -o "public/assets/$k.png"; then echo "-> $k png"; else rm -f "public/assets/$k.png"; fi
          done
          # Safety net: every image observed on the live site
          for f in logo.png halal.png hero.png packaging.png catering.png amala.png asaro.png ayamase.png beef-suya.png eba.png ewa.png fried-rice.png gbegiri.png gizzard.png meat-pies.png moi.png ofada-rice.png okro.png plantain.png poundo.png small-chops.png efo-riro-20261006.webp egusi-20261006.webp ogbono-20261006.webp pepper-soup-20261006.webp; do
            [ -s "public/assets/$f" ] || get "assets/$f"
          done
          ls -la public public/assets

      - name: Commit imported files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          git diff --cached --quiet && echo "No changes" || git commit -m "Import YamZah Kitchen site from original deployment"
          git push
